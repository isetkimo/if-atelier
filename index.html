<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如果的室｜美學療癒所</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f6f1ea;
  --text:#2c2c2c;
  --soft:#b89b7a;
  --gray:#666;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Noto Serif TC", serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.8;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(246,241,234,0.8);
  backdrop-filter: blur(10px);
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  z-index:10;
}

nav .logo{
  font-family:"Playfair Display";
  font-size:20px;
}

nav a{
  margin-left:20px;
  text-decoration:none;
  color:var(--text);
  font-size:14px;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:42px;
  font-weight:300;
  margin-bottom:20px;
}

.hero p{
  color:var(--gray);
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  padding:14px 28px;
  background:var(--soft);
  color:white;
  border-radius:30px;
  text-decoration:none;
  transition:0.3s;
}

.btn:hover{
  transform:translateY(-2px);
}

/* SECTION */
section{
  padding:80px 20px;
  max-width:1100px;
  margin:auto;
}

/* ABOUT */
.about{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}

.about img{
  width:100%;
  border-radius:10px;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

/* CTA */
.cta{
  text-align:center;
  padding:80px 20px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
  font-size:12px;
  color:var(--gray);
}

/* RWD */
@media(max-width:768px){
  .about{
    grid-template-columns:1fr;
  }

  .services{
    grid-template-columns:1fr;
  }

  nav{
    padding:15px 20px;
  }

  .hero h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">If Atelier</div>
  <div>
    <a href="#about">關於</a>
    <a href="#services">服務</a>
    <a href="#contact">預約</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div>
    <h1>讓變美這件事<br>慢一點也沒關係</h1>
    <p>Beauty & Healing Space</p>
    <a class="btn" href="https://line.me/" target="_blank">LINE立即預約</a>
  </div>
</div>

<!-- ABOUT -->
<section id="about" class="about">
  <div>
    <h2>在這裡，我們不趕時間</h2>
    <p>
      從肌膚到心情，我們相信真正的美不是改變，
      而是回到最舒服的狀態。
    </p>
  </div>

  <img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2" alt="">
</section>

<!-- SERVICES -->
<section id="services">
  <h2 style="text-align:center;margin-bottom:40px;">服務項目</h2>

  <div class="services">

    <div class="card">
      <h3>韓式皮膚管理</h3>
      <p>深層清潔 × 修護保養</p>
      <p>$1200起</p>
    </div>

    <div class="card">
      <h3>日式美甲設計</h3>
      <p>簡約質感 × 手部美學</p>
      <p>$1000起</p>
    </div>

    <div class="card">
      <h3>紓壓放鬆療程</h3>
      <p>肩頸放鬆 × 壓力釋放</p>
      <p>$1500起</p>
    </div>

  </div>
</section>

<!-- CTA -->
<section id="contact" class="cta">
  <h2>預約你的專屬療癒時間</h2>
  <p>點擊下方加入 LINE 預約</p>
  <br>
  <a class="btn" href="https://line.me/" target="_blank">加入LINE預約</a>
</section>

<footer>
  © If Atelier Beauty & Healing Space
</footer>

</body>
</html>
