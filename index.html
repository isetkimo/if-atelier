<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>If atelier</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Noto Serif TC";
  background:#f6f1eb;
  color:#2c2c2c;
  line-height:1.8;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:25px 60px;
  background:transparent;
  z-index:10;
}

nav a{
  margin-left:20px;
  font-size:13px;
  text-decoration:none;
  color:#333;
}

/* HERO（左右分割） */
.hero{
  display:flex;
  height:100vh;
}

.hero-left{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px;
}

.hero-left h1{
  font-size:52px;
  letter-spacing:6px;
  font-weight:300;
  margin:0;
}

.hero-left p{
  margin-top:10px;
  color:#666;
}

.hero-left button{
  margin-top:20px;
  padding:12px 26px;
  border:none;
  background:#c7b7a3;
  color:white;
  border-radius:30px;
}

.hero-right{
  flex:1;
  background:url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9') center/cover;
  position:relative;
}

.hero-right::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(246,241,235,0.25);
}

/* SECTION 2 */
.section{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:120px 12%;
  gap:80px;
}

.text{
  flex:1;
}

.text h2{
  font-size:26px;
  font-weight:300;
}

.text p{
  color:#666;
  font-size:14px;
}

.img{
  flex:1;
}

.img img{
  width:100%;
  border-radius:12px;
}

/* SERVICES */
.services{
  padding:80px 12%;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px;
  margin-top:40px;
}

.card{
  padding:20px;
  border-left:1px solid #ddd;
}

.card h3{
  font-size:14px;
  font-weight:400;
}

.card p{
  font-size:12px;
  color:#888;
}

/* CTA */
.cta{
  text-align:center;
  padding:80px;
}

.cta button{
  background:#c7b7a3;
  color:white;
  padding:12px 26px;
  border:none;
  border-radius:30px;
}

/* RWD */
@media(max-width:768px){
  .hero{flex-direction:column;}
  .section{flex-direction:column;}
  .grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div>If atelier</div>
  <div>
    <a href="#">關於我們</a>
    <a href="#">服務項目</a>
    <a href="#">作品欣賞</a>
    <a href="#">預約</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-left">
    <div>
      <h1>如果的室</h1>
      <p>美學療癒所 if atelier</p>
      <button>立即預約</button>
    </div>
  </div>

  <div class="hero-right"></div>
</div>

<!-- ABOUT -->
<div class="section">
  <div class="text">
    <h2>在這裡，我們只專注於妳</h2>
    <p>
      如果生活可以慢一點，那我們就慢一點。
      在這裡，每一次保養都是一次安靜的修復。
    </p>
  </div>

  <div class="img">
    <img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2">
  </div>
</div>

  
  <!-- SERVICES 修正版 -->
<div class="services">
  <h2>服務項目</h2>

  <div class="grid">
    <div class="card">
      <h3>韓式皮膚管理</h3>
      <p>$1200 起</p>
    </div>

    <div class="card">
      <h3>日式美甲設計</h3>
      <p>$1000 起</p>
    </div>

    <div class="card">
      <h3>手部基礎保養</h3>
      <p>$800 起</p>
    </div>

    <div class="card">
      <h3>舒壓放鬆護理</h3>
      <p>$1500 起</p>
    </div>
  </div>
</div>
<!-- CTA -->
<div class="cta">
  <h2>讓自己回到最舒服的狀態</h2>
  <button>立即預約</button>
</div>

</body>
</html>
