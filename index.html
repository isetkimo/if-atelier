<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>If atelier｜預約系統3.0</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Noto Serif TC";
  background:#f6f1eb;
  color:#2c2c2c;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
  background:rgba(246,241,235,0.9);
  backdrop-filter:blur(10px);
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9') center/cover;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(246,241,235,0.5);
}

.hero-content{
  position:relative;
  z-index:2;
}

section{
  padding:90px 14%;
}

/* FORM */
.form input, .form select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

.time-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.time-btn{
  padding:10px;
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
  cursor:pointer;
}

.time-btn.active{
  background:#a8927b;
  color:white;
}

button{
  width:100%;
  padding:14px;
  background:#a8927b;
  border:none;
  color:white;
  border-radius:10px;
  margin-top:10px;
}

/* LINE */
.line{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#06c755;
  color:white;
  padding:14px 18px;
  border-radius:50px;
  text-decoration:none;
}
</style>
</head>

<body>

<nav>
  <div>If atelier</div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>如果的室</h1>
    <p>美學療癒所｜預約系統</p>
  </div>
</section>

<!-- BOOKING -->
<section class="form">
  <h2>預約時間</h2>

  <input id="name" placeholder="姓名">
  <input id="phone" placeholder="電話">

  <select id="service">
    <option>韓式皮膚管理</option>
    <option>日式美甲</option>
    <option>美睫設計</option>
  </select>

  <input type="date" id="date">

  <h3>選擇時段</h3>

  <div class="time-grid">
    <div class="time-btn" onclick="selectTime(this)">10:00</div>
    <div class="time-btn" onclick="selectTime(this)">12:00</div>
    <div class="time-btn" onclick="selectTime(this)">14:00</div>
    <div class="time-btn" onclick="selectTime(this)">16:00</div>
    <div class="time-btn" onclick="selectTime(this)">18:00</div>
    <div class="time-btn" onclick="selectTime(this)">20:00</div>
  </div>

  <button onclick="submitBooking()">送出預約</button>
</section>

<a class="line" id="lineBtn" href="#">
LINE 預約
</a>

<script>
let selectedTime = "";

function selectTime(el){
  document.querySelectorAll(".time-btn").forEach(b=>{
    b.classList.remove("active");
  });
  el.classList.add("active");
  selectedTime = el.innerText;
}

function submitBooking(){

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const service = document.getElementById("service").value;
  const date = document.getElementById("date").value;

  const msg =
`預約資訊
姓名：${name}
電話：${phone}
服務：${service}
日期：${date}
時間：${selectedTime}`;

  // 👉 LINE帶入訊息
  const lineURL = "https://line.me/R/ti/p/你的LINEID?text=" + encodeURIComponent(msg);

  document.getElementById("lineBtn").href = lineURL;

  // 👉 模擬寫入 Google Sheet（之後可串API）
  console.log("寫入資料庫：", {
    name, phone, service, date, selectedTime
  });

  alert("已建立預約，請點LINE完成確認");
  window.location.href = lineURL;
}
</script>

</body>
</html>
