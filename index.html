<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>如果的室 if atelier｜美學療癒所</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">

  <div class="hero-text">
    <p class="brand">if atelier</p>

    <h1>如果的室</h1>
    <h2>美學療癒所</h2>

    <p class="slogan">
      讓保養變成一種安靜的儀式<br>
      Every woman deserves a place to heal
    </p>

    <a href="#booking" class="btn">立即預約</a>
  </div>

  <div class="hero-image">
    <img src="images/hero.jpg" alt="if atelier">
  </div>

</header>

<section class="about">
  <h2>關於我們</h2>
  <p>
    如果生活可以慢一點，<br>
    我們希望給你一個可以放鬆的地方。
  </p>
</section>

<section class="services">
  <h2>服務項目</h2>

  <div class="card">
    <h3>韓式皮膚管理</h3>
    <p>深層清潔＋保濕修護</p>
    <b>$1200 起</b>
  </div>

  <div class="card">
    <h3>日式美甲</h3>
    <p>自然款 / 貓眼 / 設計款</p>
    <b>$1000 起</b>
  </div>

</section>

<section class="booking" id="booking">
  <h2>立即預約</h2>

  <form>
    <input type="text" placeholder="姓名">
    <input type="tel" placeholder="電話">

    <select>
      <option>選擇服務</option>
      <option>韓式皮膚管理</option>
      <option>日式美甲</option>
    </select>

    <input type="date">
    <input type="time">

    <button type="submit">送出</button>
  </form>
</section>

<footer>
  if atelier © 2026
</footer>

</body>
</html>
